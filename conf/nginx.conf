location __PATH__/static/ {
    alias __INSTALL_DIR__/static/;
    expires 30d;
}

location __PATH__/media/ {
    alias __INSTALL_DIR__/media/;
    expires 30d;
}

location __PATH__/ {
    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Only set the one scheme header gunicorn's secure_scheme_headers and
    # Django's SECURE_PROXY_SSL_HEADER both agree on. Setting more than one
    # of gunicorn's recognized headers (X-Forwarded-Protocol/-Proto/-Ssl)
    # with disagreeing values makes it 400 with "Contradictory scheme headers".
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 30;
    proxy_send_timeout 30;
    proxy_connect_timeout 30;
    proxy_redirect off;

    proxy_pass http://127.0.0.1:__PORT__;
}
